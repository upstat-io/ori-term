# Spec Conformance — Spec Corpus Manifest
#
# Each `[specs.<key>]` entry describes one specification document
# used by the catalog's `Spec source` column. Redistributable
# specs are committed under `plans/spec-conformance/specs/`;
# license-restricted specs are cached locally via `manifest-fetch.sh`.
#
# Schema: 0.1-provisional (same lifecycle as the catalog schema).
#
# License classifications were verified 2026-04-12 against upstream
# source URLs and project license files.

schema_version = "0.1-provisional"

# -----------------------------------------------------------------
# ECMA-48 — the primary baseline spec for C0/CSI/ESC/SGR/modes
# -----------------------------------------------------------------
[specs.ecma_48]
url = "https://ecma-international.org/wp-content/uploads/ECMA-48_5th_edition_june_1991.pdf"
local_path = "specs/ecma-48.pdf"
license = "ECMA copyright policy — free download, redistribution permitted with disclaimer"
redistributable = false  # PDF is large; fetch on demand
sha256 = ""  # filled by manifest-fetch.sh

# -----------------------------------------------------------------
# xterm ctlseqs — Thomas Dickey's xterm control sequences reference
# -----------------------------------------------------------------
[specs.xterm_ctlseqs]
url = "https://invisible-island.net/xterm/ctlseqs/ctlseqs.html"
local_path = "specs/xterm-ctlseqs.html"
license = "MIT (xterm project license)"
redistributable = false  # large HTML document; fetch on demand
sha256 = ""

