# Spec Conformance — Capture Manifest
#
# Deterministic real-app PTY transcripts used by Section 01.8's
# reconciliation pass. Each `[[capture]]` entry describes one
# scripted interactive flow:
#
#   - `script` points at a `.script` file in `captures/scripts/`
#     describing keystrokes + text + explicit waits.
#   - `transcript` is the `.cap` file produced by running
#     `scripts/replay-capture-script.py <script>` on a Linux host.
#   - `sha256` pins the transcript contents — any drift fails
#     `verify-manifest.sh`.
#   - `unique_tuples_expected_min` is the minimum number of unique
#     `(category, intermediates, final_byte)` tuples the capture
#     must produce to clear the idle-rejection gate.
#
# Schema version is `0.1-provisional` — Section 04.7 freezes it
# alongside the catalog schema freeze.
#
# Captures are NOT a primary verification mechanism. vttest, tack,
# teseq, and Section 04's spec_chain harness are spec-driven and
# deterministic — they carry the verification weight. Captures
# exist solely to find de-facto sequences that real apps emit
# which the catalog has not yet rowed. Section 01.8 reconciles
# `dispatch ∪ NamedPrivateMode vs catalog vs captures` and files
# any capture-only tuples into `catalog/de-facto-behaviors.md` or
# flags them as missing dispatch work.
#
# ----------------------------------------------------------------
# idle_reject_threshold: the minimum number of unique
# `(category, intermediates, final_byte)` tuples a capture must
# produce to clear the idle gate. A capture below this floor is
# presumed to be a broken script (TUI didn't launch, wrong term
# config, crashed on connect, etc.).
#
# The initial Section 01.4 draft set this at 20. Post-01.5
# calibration against real captures from 10 apps under vte's
# tuple granularity revealed that even busy TUIs like btop collapse
# into 10-25 unique tuples because `vte::Parser` buckets
# parameterized sequences tightly (e.g., every `CSI <r>;<c> H`
# resolves to the same `(CSI, [], Ps;Ps, H)` tuple regardless of
# row/col). The current floor of 8 still catches broken scripts
# that produce only alt-screen-enter + erase-display + alt-screen-
# leave (which is 3-5 tuples total) without false-rejecting any
# of the 10 legitimate captures.
# ----------------------------------------------------------------

schema_version = "0.1-provisional"
idle_reject_threshold = 8

# -----------------------------------------------------------------
# vim — edit mode + motion + visual mode + save/quit
# -----------------------------------------------------------------
[[capture]]
app = "vim"
version = "9.1.0"
os = "Linux"
term_env = "xterm-256color"
script = "captures/scripts/vim-edit-passwd.script"
transcript = "captures/vim-edit-passwd.cap"
duration_seconds = 8
unique_tuples_expected_min = 20
sha256 = "a2d360f34080bb4243651f44e3d9f05a3922aeabd671311710fa915e7dc259c0"

