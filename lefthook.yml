pre-commit:
  parallel: true
  commands:
    fmt:
      glob: "*.rs"
      run: cargo fmt --all -- --check
    clippy:
      glob: "*.rs"
      run: cargo clippy --target x86_64-pc-windows-gnu -- -D warnings
    build:
      glob: "*.rs"
      run: cargo build --target x86_64-pc-windows-gnu
    test:
      glob: "*.rs"
      interactive: true
      run: cargo test
    prose-lint:
      # No glob — prose-lint is a whole-repo scan and MUST run on every
      # commit regardless of staged file types. A commit touching only
      # .toml / .sh / .json must still fail when authored .md / .rs prose
      # violations exist. The script handles its own scope (term_repo/).
      run: python3 scripts/prose-lint.py .
    hygiene-file-length:
      glob: "*.rs"
      # Broken-window cure for BUG-08-036 + BUG-11-018 + BUG-08-006: any
      # commit that touches a file already over the 500-line limit (or
      # creates a new one) fails here, surfacing the structural split
      # mandate at stage time instead of letting drift accumulate.
      # --staged scopes the check to files in this commit; the rest of
      # the repo's pre-existing findings are out of scope until each is
      # cleaned via /fix-bug.
      run: python3 ../.claude/skills/impl-hygiene-review/hygiene-lint.py --staged --check file-length

commit-msg:
  commands:
    conventional-commit:
      run: .lefthook/commit-msg.sh {1}
