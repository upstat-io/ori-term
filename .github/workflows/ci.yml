name: CI

on:
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Cancel previous runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast checks — run first, fail fast
  version-check:
    name: Version Sync
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check version synchronization
        run: ./scripts/sync-version.sh --check

  prose-lint:
    name: Prose Lint
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run prose-lint
        run: python3 scripts/prose-lint.py .

  format:
    name: Format
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy (Linux)
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: clippy
      - run: cargo clippy --workspace -- -D warnings

  clippy-windows-cross:
    name: Clippy (Windows cross)
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross
      - run: cargo clippy --workspace --target x86_64-pc-windows-gnu -- -D warnings

  # Main test suite
  test-linux:
    name: Test (Linux)
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libvulkan-dev \
            fonts-dejavu-core \
            vttest \
            teseq
      - uses: Swatinem/rust-cache@v2
        with:
          key: test-linux
      - name: Clear stale uncataloged-sequence spool
        # `target/spec-chain-uncataloged/` is populated by test runs and
        # consumed by `spec-coverage-report --check`'s backlog gate. The
        # rust-cache restores `target/`, so without this explicit clean
        # the gate reads yesterday's accumulated sequences on top of
        # today's — stateful pollution causing spurious backlog failures.
        run: rm -rf target/spec-chain-uncataloged
      - name: Spec coverage lint
        run: cargo run -p oriterm_test_support --bin spec-coverage-report -- --check
      - name: Audit-files lint
        run: cargo run -p oriterm_test_support --bin spec-coverage-report -- --check audit-files
      - name: Run tests
        id: tests
        continue-on-error: true
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee test-output.txt
          PASSED=$(grep -oE '[0-9]+ passed' test-output.txt | grep -oE '^[0-9]+' | awk '{sum+=$1} END {print sum+0}')
          FAILED=$(grep -oE '[0-9]+ failed' test-output.txt | grep -oE '^[0-9]+' | awk '{sum+=$1} END {print sum+0}')
          IGNORED=$(grep -oE '[0-9]+ ignored' test-output.txt | grep -oE '^[0-9]+' | awk '{sum+=$1} END {print sum+0}')
          echo "PASSED=$PASSED" >> $GITHUB_ENV
          echo "FAILED=$FAILED" >> $GITHUB_ENV
          echo "IGNORED=$IGNORED" >> $GITHUB_ENV
      - name: Save test results
        if: always()
        run: |
          cat > test-results.json << EOF
          {
            "timestamp": "$(date -u +%Y-%m-%dT%H:%M:%SZ)",
            "platform": "linux",
            "passed": ${PASSED:-0},
            "failed": ${FAILED:-0},
            "ignored": ${IGNORED:-0}
          }
          EOF
          cat test-results.json
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-linux
          path: test-results.json
          retention-days: 90
      - name: Fail if tests failed
        if: steps.tests.outcome == 'failure'
        run: exit 1

  # Cross-platform tests
  cross-platform:
    name: Test (${{ matrix.name }})
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned to windows-2022 (not windows-latest) because the
          # current windows-latest image (windows-2025) regressed
          # conhost's console-buffer→VT translation on ConPTY-attached
          # children ~2026-05-13: child program output never reaches
          # the master pipe, only conhost's init+shutdown handshake.
          # Visible via `pty_size_propagation_windows_pwsh_...`
          # capturing `\x1b[6n...\x1b[?9001l\x1b[?1004l` with no
          # program output between the title-set and shutdown
          # sequences. windows-2022 still routes child stdout
          # correctly through ConPTY.
          - os: windows-2022
            name: Windows
          - os: macos-latest
            name: macOS
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}
      - run: cargo test --workspace

  build-windows-cross:
    name: Build (Windows cross)
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install MinGW toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 binutils-mingw-w64-x86-64
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-cross
      - run: cargo build --workspace --target x86_64-pc-windows-gnu

  bench-compile:
    name: Benchmark Compile Check
    if: "!startsWith(github.event.head_commit.message, 'chore: release v')"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libegl-dev \
            libvulkan-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: bench
      - name: Compile benchmarks (no run)
        run: cargo bench --workspace --no-run

  # Single status check for branch protection
  ci-success:
    name: CI Success
    needs: [version-check, prose-lint, format, clippy, clippy-windows-cross, test-linux, cross-platform, build-windows-cross, bench-compile]
    runs-on: ubuntu-latest
    if: "always() && !startsWith(github.event.head_commit.message, 'chore: release v')"
    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.version-check.result }}" != "success" ]] || \
             [[ "${{ needs.prose-lint.result }}" != "success" ]] || \
             [[ "${{ needs.format.result }}" != "success" ]] || \
             [[ "${{ needs.clippy.result }}" != "success" ]] || \
             [[ "${{ needs.clippy-windows-cross.result }}" != "success" ]] || \
             [[ "${{ needs.test-linux.result }}" != "success" ]] || \
             [[ "${{ needs.cross-platform.result }}" != "success" ]] || \
             [[ "${{ needs.build-windows-cross.result }}" != "success" ]] || \
             [[ "${{ needs.bench-compile.result }}" != "success" ]]; then
            echo "One or more required jobs failed"
            exit 1
          fi
          echo "All required checks passed!"
