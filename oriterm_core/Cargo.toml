[package]
name = "oriterm_core"
version.workspace = true
edition.workspace = true
description = "Core terminal emulation data structures and logic for oriterm"
license.workspace = true

[features]
default = ["image-protocol"]
image-protocol = ["dep:image"]
# Enables `ImageCache::*_for_test` probes for integration tests that
# compile as external crates (cannot reach `pub(crate)` items). Off by
# default — release builds do NOT ship these accessors.
test-support = []

[dependencies]
base64 = "0.22"
bitflags = "2"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "webp"], optional = true }
indexmap = "2"
log = "0.4"
parking_lot = "0.12"
regex = "1"
unicode-width = "0.2"
vte = { version = "0.15.0", features = ["ansi"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
insta = "1"
# Backend-independent zlib encoder for bench fixtures. Independent of
# the flate2 backend feature so cross-backend bench comparisons measure
# decoder cost without encoder-side variance.
miniz_oxide = "0.8"
# Self-dep with `test-support` so the `ImageCache::*_for_test` probes
# light up for integration tests under `tests/spec_chain/` (which
# compile as external crates against the crate's public API).
oriterm_core = { path = ".", features = ["test-support"] }
oriterm_test_support = { path = "../crates/oriterm_test_support" }
portable-pty = "0.9.0"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.60", features = ["Win32_Foundation", "Win32_System_ProcessStatus", "Win32_System_Threading"] }

[[bench]]
name = "grid"
harness = false

[[bench]]
name = "vte_throughput"
harness = false

[[bench]]
name = "kitty_decode"
harness = false

[lints]
workspace = true
