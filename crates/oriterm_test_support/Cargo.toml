[package]
name = "oriterm_test_support"
version.workspace = true
edition.workspace = true
description = "Shared PTY/Term/VTE test driver for oriterm conformance suites (vttest, tack, teseq)"
license.workspace = true
publish = false

[dependencies]
base64 = "0.22"
log = "0.4"
oriterm_core = { path = "../../oriterm_core" }
portable-pty = "0.9.0"
tempfile = "3"
vte = { version = "0.15.0", features = ["ansi"] }

# Section 01.3 — catalog_coverage_check binary (spec-conformance plan):
# `clap` for CLI, `syn` for Rust AST walk of dispatch/enum source files.
clap = { version = "4", features = ["derive"] }
syn = { version = "2", features = ["full", "extra-traits", "visit"] }

[[bin]]
name = "catalog_coverage_check"
path = "src/bin/catalog_coverage_check.rs"

[[bin]]
name = "spec-coverage-report"
path = "src/bin/spec_coverage_report.rs"

[[bin]]
name = "type-sizes"
path = "src/bin/type_sizes.rs"

[lints]
workspace = true
